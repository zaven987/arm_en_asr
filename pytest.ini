[pytest]
# Test settings (TEST.md section 1; DECISIONS D22).
# src/ on the import path, so tests import arm_en_asr without packaging.
pythonpath = src
testpaths = tests
markers =
    hardware: needs real PulseAudio devices and a person present (TEST.md T3)
    slow: the load test (TEST.md T4)
    eval: needs the gitignored eval clips in eval/clips/ (TEST.md T1.6; D22, added 2026-11-04)
# A plain run excludes all three markers. A -m given on the command line
# (e.g. `pytest -m hardware`) comes after this and replaces it.
addopts = -m "not hardware and not slow and not eval"
